<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>지에고 앱 · 바로 설치</title>
<meta name="description" content="지에고 게임·앱 플레이스토어 링크 모음"/>
<meta name="theme-color" content="#0f1220"/>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1220;
    --card: #1a1f33;
    --card-hover: #222941;
    --text: #f4f6ff;
    --muted: #a7b0c8;
    --accent: #7c9cff;
    --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a3560 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    margin: 0 auto 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, #7c9cff, #b388ff);
    font-weight: 800; font-size: 22px; letter-spacing: -.02em;
    box-shadow: 0 10px 30px rgba(124,156,255,.35);
  }
  h1 { margin: 0 0 6px; font-size: 1.35rem; }
  p.sub { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.45; }
  .list { display: grid; gap: 10px; margin-top: 18px; }
  a.item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit; text-decoration: none;
    transition: background .15s ease, transform .15s ease;
  }
  a.item:active { transform: scale(.985); }
  a.item:hover { background: var(--card-hover); }
  .icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center; flex: 0 0 auto;
    font-size: 1.15rem; background: rgba(124,156,255,.15);
  }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 700; font-size: 1rem; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .chev { color: var(--muted); font-size: 1.1rem; }
  footer {
    margin-top: 22px; text-align: center; color: var(--muted);
    font-size: .78rem; line-height: 1.5;
  }
</style>
</head>
